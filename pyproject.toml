[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydatavault"
version = "0.1.0"
description = "GUI application for managing heterojunction fabrication and measurement data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "plotly>=6.0",
    "PySide6>=6.5",
    "pyflexlab",
    "pyomnix",
    "zstandard>=0.22",
]

[project.scripts]
pydatavault = "pydatavault.__main__:main"
pydatavault-flake-api = "pydatavault.flake_api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pydatavault*"]
